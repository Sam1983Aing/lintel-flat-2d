<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The light is one number</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfd6da; color: #1d1b18; font: 14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 16px; top: 16px; width: 260px; padding: 14px 16px; background: rgba(255, 253, 248, 0.94); border: 1px solid rgba(29, 27, 24, 0.2); }
  .panel h1 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .panel label { display: block; margin-top: 9px; }
  .panel input[type=range] { width: 100%; margin: 2px 0 0; }
  .panel p { margin: 10px 0 0; color: #6b655c; font-size: 12.5px; }
  .panel button { margin: 8px 6px 0 0; padding: 5px 9px; font: inherit; font-size: 12.5px; background: none; border: 1px solid rgba(29, 27, 24, 0.4); cursor: pointer; }
  .panel button.on { background: #1d1b18; color: #fffdf8; }
  #read { margin-top: 10px; font-variant-numeric: tabular-nums; font-size: 20px; }
  @media (max-width: 700px) { .panel { top: auto; bottom: 16px; right: 16px; width: auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>The light is one number</h1>
  <div id="read"></div>
  <label>Clock <input type="range" id="clock" min="16" max="19.6" step="0.01" value="17.17"></label>
  <button data-look="warm">Warm Afternoon</button><button data-look="golden">Golden Hour</button><button data-look="passes">The Afternoon Passes</button>
  <p>Three looks, one table. A look is only a time of day. The third one moves the clock.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
/* The light is one number
   Card: "The light is one number" in ../02-techniques.md

   Everything about the light follows from how high the sun stands. One table says what the sun, the shade, the sky,
   the haze and the exposure do at five heights. The code blends between two rows. A "look" is then only a clock.
   (The real page blends two photographed skies as well. Here the sky is a plain colour.) */

// ---- the knobs ----
// One row per sun height (el, in degrees above the horizon). The sun and ground colours are the ones from the build.
const HOURS = [
  { el: 44, sun: 0xfff0dc, power: 3.0, sky: 0xbcd3ea, ground: 0xd8c8b0, hemi: 1.5, haze: 0xcfd6da, exposure: 0.95 },
  { el: 32, sun: 0xffd9a8, power: 3.1, sky: 0xbfcfe2, ground: 0xd8be98, hemi: 1.35, haze: 0xd0d5d4, exposure: 0.98 },
  { el: 20, sun: 0xffc282, power: 3.2, sky: 0xc9cbdc, ground: 0xd4ac7c, hemi: 1.1, haze: 0xdcc9ac, exposure: 1.08 },
  { el: 12, sun: 0xffa758, power: 3.1, sky: 0xcdbcc4, ground: 0xcc9a66, hemi: 0.85, haze: 0xdcb38a, exposure: 1.22 },
  { el: 5, sun: 0xff8a3c, power: 2.8, sky: 0xc9a79c, ground: 0xc48a58, hemi: 0.75, haze: 0xd8a57c, exposure: 1.34 },
];
const LOOKS = { warm: 17.17, golden: 19.0 };   // a look is a clock: ten past five, seven in the evening
const PASSES = [16.0, 19.5, 16];               // the third look: from, to, and how many seconds the afternoon takes here
const DEG = Math.PI / 180;

// How high the sun stands at a given hour (the build's own formula: one place, one day of the year).
const elAt = (t) => Math.asin(0.0655 + 0.775 * Math.cos((t - 13.63) * 15 * DEG)) / DEG;
// Where it stands on the compass. Simplified here: it swings from south-west to west as the afternoon goes.
const azAt = (t) => (236 + (t - 16) * 13) * DEG;

HOURS.forEach((h) => ['sun', 'sky', 'ground', 'haze'].forEach((k) => { h[k] = new THREE.Color(h[k]); }));
const mix = { sun: new THREE.Color(), sky: new THREE.Color(), ground: new THREE.Color(), haze: new THREE.Color() };
function hourAt(el) {                           // blend the two rows this height lies between
  let i = 0;
  while (i < HOURS.length - 2 && el < HOURS[i + 1].el) i++;
  const a = HOURS[i], b = HOURS[i + 1], u = Math.min(1, Math.max(0, (a.el - el) / (a.el - b.el)));
  ['sun', 'sky', 'ground', 'haze'].forEach((k) => mix[k].copy(a[k]).lerp(b[k], u));
  ['power', 'hemi', 'exposure'].forEach((k) => { mix[k] = a[k] + (b[k] - a[k]) * u; });
  return mix;
}

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color();
scene.fog = new THREE.Fog(0xffffff, 30, 160);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 400);
camera.position.set(15, 6.5, 19);
camera.lookAt(0, 1.6, 0);
const hemi = new THREE.HemisphereLight();
const sun = new THREE.DirectionalLight();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 120 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(hemi, sun);

function box(w, h, d, x, y, z, color, rough) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: rough === undefined ? 0.9 : rough }));
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
box(400, 0.2, 400, 0, -0.2, 0, 0x9aa06a);                                    // the land
box(16, 0.12, 9, 0, 0, 2, 0xd9d2c2);                                         // a stone terrace
box(8, 3, 4.5, -3, 0.12, -1, 0xf3eee4); box(9, 0.25, 5.6, -3, 3.12, -0.6, 0xe8e2d6);   // the house and its roof
box(1.6, 2.1, 0.1, -3, 0.12, 1.28, 0x3f4b55, 0.2);                           // a window
for (let i = 0; i < 9; i++) box(0.12, 0.16, 4.2, 2.2 + i * 0.55, 2.7, 1.4, 0x7a5c44);   // a slatted pergola, so the height of the sun shows
box(0.14, 2.7, 0.14, 2.2, 0.12, 3.4, 0x7a5c44); box(0.14, 2.7, 0.14, 6.6, 0.12, 3.4, 0x7a5c44);
box(5, 0.06, 2.2, -1.5, 0.1, 4.6, 0x4f9db0, 0.15);                           // a pool
[[-9, 3, 1.1, 5.2], [8.5, -3, 0.9, 6.2], [10, -1.6, 0.8, 5]].forEach(([x, z, r, h]) => {   // three cypresses
  const t = new THREE.Mesh(new THREE.ConeGeometry(r, h, 14), new THREE.MeshStandardMaterial({ color: 0x3f5a34, roughness: 1 }));
  t.position.set(x, h / 2, z);
  t.castShadow = true;
  scene.add(t);
});

const ui = { clock: document.getElementById('clock'), read: document.getElementById('read'), buttons: [...document.querySelectorAll('button')] };
let look = 'warm', t0 = 0;
ui.buttons.forEach((b) => b.addEventListener('click', () => { look = b.dataset.look; t0 = performance.now(); if (LOOKS[look]) ui.clock.value = LOOKS[look]; }));
ui.clock.addEventListener('input', () => { look = ''; });

function apply(clock) {                         // the whole lighting rig from one number
  const el = elAt(clock), az = azAt(clock), h = hourAt(el);
  sun.position.set(Math.cos(el * DEG) * Math.sin(az), Math.sin(el * DEG), Math.cos(el * DEG) * Math.cos(az)).multiplyScalar(50);
  sun.color.copy(h.sun);
  sun.intensity = h.power;
  hemi.color.copy(h.sky);
  hemi.groundColor.copy(h.ground);
  hemi.intensity = h.hemi;
  scene.background.copy(h.sky).lerp(h.haze, 0.45);
  scene.fog.color.copy(scene.background);
  renderer.toneMappingExposure = h.exposure;
  const hh = Math.floor(clock), mm = Math.floor((clock - hh) * 60);
  ui.read.textContent = `${hh}:${String(mm).padStart(2, '0')}  ·  sun ${el.toFixed(0)}° up`;
}

function frame(now) {
  if (look === 'passes') {
    const u = ((now - t0) / 1000 / PASSES[2]) % 1;
    ui.clock.value = PASSES[0] + (PASSES[1] - PASSES[0]) * u;
  }
  ui.buttons.forEach((b) => b.classList.toggle('on', b.dataset.look === look));
  apply(+ui.clock.value);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
